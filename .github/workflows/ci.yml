# CI des Module-Repos: Modul `aidev` gegen den gepinnten Core (.core = Submodul auf festem Tag) – Pflicht.
# Zusätzlich gegen den aktuellen Core-Stand (`main`) als Warnung (continue-on-error). Runner als eigener Job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  CI: 'true'
  APP_SECRET: build-time-placeholder-build-time-placeholder

jobs:
  modules:
    name: Modul (${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        core: [pinned, main]
    continue-on-error: ${{ matrix.core == 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # Core liegt (privat) in KalypzoSolutions: Token mit Lesezugriff als Secret CORE_REPO_TOKEN hinterlegen
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}
      - name: Core auf main (nur Warnlauf)
        if: matrix.core == 'main'
        run: git -C .core fetch origin main && git -C .core checkout origin/main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .core/.nvmrc
      - run: npm run setup
      - run: npm run check:catalog
      - run: npm run check:migrations
      - run: npm run format:check
      - name: Typprüfung
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  runner:
    name: Runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: runner
      - run: npm run check
        working-directory: runner
      - run: npm test
        working-directory: runner
      - run: npm run build
        working-directory: runner
      - name: Docker-Image bauen
        run: docker build -f runner/Dockerfile -t atrium-aidev-runner .
